<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Plant NFC Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900">
  <header class="bg-green-700 text-white p-4 sticky top-0 z-20 shadow">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <a href="/" class="font-semibold">🌿 Plant NFC Tracker</a>
      <div class="text-xs sm:text-sm flex gap-2">
        <a href="/plants/new" class="bg-white/20 px-3 py-1 rounded">+ Plant</a>
        <a href="/export/csv" class="bg-white/20 px-3 py-1 rounded">Export</a>
      </div>
    </div>
  </header>
  <main class="max-w-4xl mx-auto p-3 sm:p-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
